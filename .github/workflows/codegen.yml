name: codegen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache generator jar
        uses: actions/cache@v4
        with:
          path: .codegen-cache
          key: openapi-generator-7.11.0

      - name: Regenerate SDK
        run: bash scripts/generate.sh

      - name: Fail on drift
        run: git diff --exit-code -- src/general_liquidity docs test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        # pytest is not a dependency of the package, so `pip install -e .` alone
        # leaves the next step with no runner. This job has been red on that since
        # it was added, while ci.yml stayed green because it never runs the tests.
        run: |
          pip install -e .
          pip install pytest

      - name: Test
        run: pytest
